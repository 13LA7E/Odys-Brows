[package]
name = "odyssey"
version = "0.1.0"
description = "Odyssey - an AI-first browser powered by your own Odysseus"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["multipart", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
percent-encoding = "2"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
tauri-runtime = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[workspace]
resolver = "3"
members = [
    "app/shell",
    "app/engine-api",
    "app/engine-cef",
    "app/segdl",
    "app/history",
    "app/shields",
    "app/vault",
    "app/ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Licence not decided yet (Q-05): keep the crates unpublished until it is.
publish = false

[workspace.dependencies]
# Pinned exactly: the CEF version follows the crate version (D-003, P0-02).
cef = { version = "=156.7.0", default-features = false }
engine-api = { path = "app/engine-api" }
engine-cef = { path = "app/engine-cef" }
segdl = { path = "app/segdl" }
history = { path = "app/history" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream", "json", "multipart"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
shields = { path = "app/shields" }
ai = { path = "app/ai" }
vault = { path = "app/vault" }
base64 = "0.22"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "shell"
description = "The browser: windows, tabs and the bridge to our UI."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "constellations"
path = "src/main.rs"

[dependencies]
engine-cef.workspace = true
engine-api.workspace = true
segdl.workspace = true
history.workspace = true
shields.workspace = true
ai.workspace = true
vault.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# Reason: decode and check the new-tab wallpaper image the user picks (wallpaper.rs).
base64.workspace = true
# Reason: read the text of PDF files the user attaches to a chat message (attachments.rs).
pdf-extract = "0.12"
# Reason: a Word (.docx) file is a zip of XML; read its text for attachments (attachments.rs).
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true

# Reason: embeds the application icon (app.rc) in the Windows exe so the taskbar, Start menu and
# search show it.
[build-dependencies]
embed-resource = "3"

# Reason: Windows Hello / Windows password check before passwords are revealed or exported.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_WinRT",
]

# Reason: the async result type of the Windows Hello call (.join() waits for the answer).
[target.'cfg(windows)'.dependencies.windows-future]
version = "0.3"

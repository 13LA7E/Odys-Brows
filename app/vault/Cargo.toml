[package]
name = "vault"
description = "Password vault (DPAPI on Windows, Secret Service on Linux), ported in P8-02."
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

# Reason: OS credential store (Linux Secret Service, Windows Credential Manager) for AUDIT-10/13.
# The Linux feature set is unverified (never built on Linux yet).
[dependencies.keyring]
version = "3.6"
default-features = false
features = ["windows-native", "sync-secret-service", "crypto-rust", "vendored"]

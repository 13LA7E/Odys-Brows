[package]
name = "p0-04-helm"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone spike, not part of any workspace.
[workspace]

[dependencies]
# Pinned exactly so the CEF version is reproducible (D-003 spike).
cef = { version = "=156.7.0", default-features = false }

# Already in the dependency tree through `cef`; used directly for the P0-04b layered Helm window.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

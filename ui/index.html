<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odyssey</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- Window resize edges (hidden when maximized) -->
  <div id="edges">
    <i data-edge="n"></i><i data-edge="s"></i><i data-edge="e"></i><i data-edge="w"></i>
    <i data-edge="ne"></i><i data-edge="nw"></i><i data-edge="se"></i><i data-edge="sw"></i>
  </div>

  <header id="chrome">
    <div id="titlebar">
      <div class="app-mark" data-drag title="Odyssey">
        <svg viewBox="0 0 24 24" class="sail"><path class="s1" d="M11.4 3 5.2 15h6.2z"/><path class="s2" d="M12.2 6.2V15h5.4z"/><path class="wave" d="M3.5 18.2c2.4-1.6 4.6-1.6 7 0s4.6 1.6 7 0c.9-.6 1.8-1 2.7-1.1"/></svg>
      </div>
      <div id="tabs" role="tablist"></div>
      <button id="newtab-btn" class="icon-btn small" title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
      <div class="drag-space" data-drag></div>
      <div class="win-ctrls">
        <button id="win-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
        <button id="win-max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
        <button id="win-close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="m2.5 2.5 7 7M9.5 2.5l-7 7"/></svg></button>
      </div>
    </div>

    <div id="toolbar">
      <button id="back-btn" class="icon-btn" title="Back (Alt+Left)" aria-label="Back"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
      <button id="fwd-btn" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
      <button id="reload-btn" class="icon-btn" title="Reload (F5)" aria-label="Reload"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg></button>
      <form id="omni-form" autocomplete="off">
        <span id="omni-mode" class="mode ask"><i></i><span>Ask</span></span>
        <input id="omni" spellcheck="false" placeholder="Ask anything or enter a website" aria-label="Address and question bar" />
        <button type="button" id="star-btn" class="omni-btn" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark"><svg viewBox="0 0 16 16"><path d="m8 2 1.8 3.8 4.2.5-3.1 2.9.8 4.1L8 11.3l-3.7 2 .8-4.1L2 6.3l4.2-.5z"/></svg></button>
        <button type="button" id="shield-btn" class="omni-btn shield" title="Shields" aria-label="Shields">
          <svg viewBox="0 0 16 16"><path d="M8 1.8 13 3.6v3.9c0 3.2-2.1 5.6-5 6.7-2.9-1.1-5-3.5-5-6.7V3.6z"/></svg>
          <span id="shield-count">0</span>
        </button>
        <button type="button" id="vault-btn" class="omni-btn" title="Fill saved password" aria-label="Fill saved password">
          <svg viewBox="0 0 16 16"><circle cx="5" cy="5" r="2.6"/><path d="M6.8 6.8 13 13M9.5 9.5l1.3 1.3M11.3 7.7l1.3 1.3"/></svg>
        </button>
      </form>
      <button id="connect-btn" class="connect-pill hidden" title="Connect Odyssey to your Odysseus">Connect Odysseus</button>
      <button id="assist-btn" class="assist-btn" title="Assistant (Ctrl+J)">
        <svg viewBox="0 0 16 16"><path d="M8 1.5 9.4 6.6 14.5 8 9.4 9.4 8 14.5 6.6 9.4 1.5 8 6.6 6.6Z"/></svg>
        <span>Assistant</span>
      </button>
      <button id="history-btn" class="icon-btn" title="History (Ctrl+H)" aria-label="History"><svg viewBox="0 0 16 16"><path d="M2.5 8a5.5 5.5 0 1 0 1.6-3.9M2.5 2.5v2.8h2.8M8 5v3.2l2.2 1.4"/></svg></button>
      <button id="settings-btn" class="icon-btn" title="Settings (Ctrl+,)" aria-label="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    </div>
  </header>

  <main id="main">
    <section id="content">
      <!-- New tab -->
      <div id="home" class="view">
        <div id="home-bg" class="home-bg"></div>
        <div id="clock" class="clock"></div>
        <div class="home-inner">
          <h1 class="wordmark">odyssey</h1>
          <form id="home-form" autocomplete="off">
            <span id="home-mode" class="mode ask"><i></i><span>Ask</span></span>
            <input id="home-input" spellcheck="false" placeholder="Ask anything, or type a website" aria-label="Ask or go" />
            <kbd class="enter-hint">Enter</kbd>
          </form>
          <div id="pinned" class="pinned"></div>
          <div id="suggest" class="suggest"></div>
          <p id="home-status" class="status-line"></p>
        </div>
      </div>

      <!-- AI answer + web results -->
      <div id="answer" class="view hidden">
        <div id="thread" class="thread"></div>
        <form id="followup-form" class="composer" autocomplete="off">
          <label class="switch" title="Let Odysseus search the web for this answer"><input type="checkbox" id="answer-web" checked /><span>Web</span></label>
          <input id="followup" spellcheck="false" placeholder="Ask a follow-up" aria-label="Follow-up question" />
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
        </form>
      </div>

      <!-- Odyssey's own pages: settings, history -->
      <div id="page" class="view hidden"></div>

      <!-- Behind web pages while they load -->
      <div id="webview-bg" class="view hidden"><div class="spinner"></div></div>
    </section>

    <aside id="sidebar" class="hidden" aria-label="Side panel">
      <div class="side-head">
        <div class="seg">
          <button data-pane="assistant" class="on">Assistant</button>
          <button data-pane="shields">Shields</button>
        </div>
        <span class="spacer"></span>
        <button id="side-new" class="icon-btn small" title="New conversation" aria-label="New conversation"><svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg></button>
        <button id="side-close" class="icon-btn small" title="Close (Ctrl+J)" aria-label="Close panel"><svg viewBox="0 0 16 16"><path d="m4 4 8 8M12 4l-8 8"/></svg></button>
      </div>

      <div id="pane-assistant" class="pane">
        <div id="side-context" class="side-context"></div>
        <div id="side-thread" class="thread"></div>
        <div class="chips">
          <button data-prompt="Summarize this page in a few bullet points.">Summarize</button>
          <button data-prompt="What are the key takeaways of this page?">Key points</button>
          <button data-prompt="Explain this page simply, as if I'm new to the topic.">Explain simply</button>
        </div>
        <form id="side-form" class="composer" autocomplete="off">
          <label class="switch" title="Send the current page's text with your question"><input type="checkbox" id="side-page" checked /><span>Page</span></label>
          <input id="side-input" spellcheck="false" placeholder="Ask about this page" aria-label="Ask the assistant" />
          <button class="send" type="submit" aria-label="Send"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
        </form>
      </div>

      <div id="pane-shields" class="pane hidden"></div>
    </aside>
  </main>

  <!-- Hidden file inputs for settings -->
  <input type="file" id="wallpaper-file" accept="image/*" style="display:none"/>
  <input type="file" id="theme-import-file" accept=".json" style="display:none"/>
  <input type="file" id="import-settings-file" accept=".json" style="display:none"/>
  
  <script src="app.js"></script>
</body>
</html>
